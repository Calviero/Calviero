<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="510" viewBox="0 0 1600 510" role="img" aria-labelledby="title desc">
  <title id="title">Calviero — Independent Developer</title>
  <desc id="desc">Portada del perfil Calviero. Diseño oscuro con brillo violeta y un lobo geométrico.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#080810"/><stop offset="0.49" stop-color="#120c24"/><stop offset="1" stop-color="#080813"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6D28D9"/><stop offset="0.5" stop-color="#A855F7"/><stop offset="1" stop-color="#D8B4FE"/></linearGradient>
    <linearGradient id="wolf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8F5FF"/><stop offset="0.65" stop-color="#D8C7FF"/><stop offset="1" stop-color="#AB79FF"/></linearGradient>
    <radialGradient id="aura"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".63"/><stop offset=".36" stop-color="#7C3AED" stop-opacity=".31"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
    <radialGradient id="smallAura"><stop offset="0" stop-color="#B799FF" stop-opacity=".19"/><stop offset="1" stop-color="#B799FF" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse"><path d="M 52 0 L 0 0 0 52" fill="none" stroke="#7B62AE" stroke-opacity=".13" stroke-width="1"/></pattern>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="bright" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3.3"/></filter>
    <clipPath id="frame"><rect width="1600" height="510" rx="30"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1600" height="510" fill="url(#bg)"/>
    <rect width="1600" height="510" fill="url(#grid)"/>
    <ellipse cx="1270" cy="245" rx="510" ry="425" fill="url(#aura)"/>
    <ellipse cx="240" cy="40" rx="440" ry="300" fill="url(#smallAura)"/>
    <circle cx="1294" cy="251" r="196" fill="none" stroke="#B595FF" stroke-opacity=".16" stroke-width="1.4"/>
    <circle cx="1294" cy="251" r="160" fill="none" stroke="#B595FF" stroke-opacity=".19" stroke-width="1.3" stroke-dasharray="8 11"/>
    <circle cx="1294" cy="251" r="118" fill="none" stroke="#D7C3FF" stroke-opacity=".13" stroke-width="1"/>
    <path d="M1015 95 C1100 5 1437 6 1547 164" fill="none" stroke="url(#violet)" stroke-opacity=".18" stroke-width="2"/>
    <path d="M977 421 C1088 504 1429 493 1571 329" fill="none" stroke="url(#violet)" stroke-opacity=".20" stroke-width="2"/>
    <path d="M0 507 H1600" stroke="url(#violet)" stroke-width="7"/>
    <g fill="#D9CCFF"><circle cx="1159" cy="84" r="2.5" opacity=".72"/><circle cx="1453" cy="112" r="2" opacity=".65"/><circle cx="1539" cy="328" r="2.5" opacity=".6"/><circle cx="1116" cy="423" r="1.6" opacity=".7"/><circle cx="1038" cy="188" r="1.8" opacity=".7"/></g>
    <g font-family="Inter, Segoe UI, Arial, sans-serif">
      <rect x="94" y="62" width="12" height="12" rx="3" fill="#A855F7"/>
      <text x="121" y="73" fill="#C6B4E9" font-size="17" letter-spacing="3.2" font-weight="600">CALVIERO STUDIO</text>
      <text x="97" y="230" fill="#FFFFFF" font-size="108" font-weight="800" letter-spacing="3">CALVIERO</text>
      <rect x="100" y="254" width="92" height="5" rx="3" fill="url(#violet)"/>
      <rect x="208" y="254" width="38" height="5" rx="3" fill="#A855F7" opacity=".3"/>
      <text x="100" y="311" fill="#D5C6F3" font-size="25" font-weight="500" letter-spacing="1.1">Independent developer. Limitless vision.</text>
      <text x="100" y="361" fill="#9C91B4" font-size="18" font-weight="500" letter-spacing="1.7">SOFTWARE  /  CYBERSECURITY  /  DIGITAL EXPERIENCES</text>
      <path d="M100 402 H680" stroke="#B9A2E2" stroke-opacity=".2"/>
      <text x="100" y="446" fill="#A98FCF" font-size="17" font-weight="500" letter-spacing="2.5">BUILDING WHAT'S NEXT</text>
      <text x="1480" y="454" text-anchor="end" fill="#C3A7F2" font-size="15" font-weight="600" letter-spacing="2">EST. IN IDEAS</text>
    </g>
    <!-- Geometric leaping wolf emblem, with aura and speed strokes. -->
    <g transform="translate(40 8)">
      <path d="M1078 291 L1144 259 L1196 249" fill="none" stroke="#BB93FF" stroke-opacity=".52" stroke-width="5" stroke-linecap="round"/>
      <path d="M1098 325 L1168 283" fill="none" stroke="#BB93FF" stroke-opacity=".36" stroke-width="3" stroke-linecap="round"/>
      <path d="M1078 291 L1144 259 L1196 249" fill="none" stroke="#BE99FF" stroke-opacity=".43" stroke-width="17" filter="url(#glow)"/>
      <path d="M1128 190 Q1169 188 1191 203 L1233 186 Q1274 157 1320 166 L1352 124 L1375 154 L1415 142 L1427 165 L1470 181 L1453 202 L1420 205 L1403 231 L1373 239 L1464 303 L1506 332 L1472 338 L1374 293 L1338 252 L1315 265 L1254 330 L1211 340 L1219 320 L1269 269 L1261 248 L1216 242 L1160 261 L1110 239 L1069 188 L1098 198 Z" fill="url(#wolf)" opacity=".24" filter="url(#bright)"/>
      <path d="M1128 190 Q1169 188 1191 203 L1233 186 Q1274 157 1320 166 L1352 124 L1375 154 L1415 142 L1427 165 L1470 181 L1453 202 L1420 205 L1403 231 L1373 239 L1464 303 L1506 332 L1472 338 L1374 293 L1338 252 L1315 265 L1254 330 L1211 340 L1219 320 L1269 269 L1261 248 L1216 242 L1160 261 L1110 239 L1069 188 L1098 198 Z" fill="url(#wolf)"/>
      <path d="M1352 124 L1375 154 L1352 163" fill="#6B35BB" opacity=".65"/>
      <path d="M1415 142 L1427 165 L1396 174" fill="#6B35BB" opacity=".65"/>
      <circle cx="1420" cy="185" r="5.5" fill="#6D28D9"/>
      <path d="M1375 204 L1403 231 L1373 239 L1353 226" fill="#A678ED" opacity=".7"/>
      <path d="M1261 248 L1288 247 L1269 269" fill="#A678ED" opacity=".7"/>
    </g>
  </g>
</svg>
