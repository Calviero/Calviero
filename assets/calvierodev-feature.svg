    <path d="M1249 193 V178 Q1249 154 1271 154 Q1293 154 1293 178 V193" fill="none" stroke="#EBDDFF" stroke-width="12" stroke-linecap="round"/>
    <circle cx="1271" cy="216" r="7" fill="#7C3AED"/><rect x="1267" y="220" width="8" height="16" rx="4" fill="#7C3AED"/>
    <g stroke="#AF88F7" stroke-width="2" opacity=".45" fill="none"><path d="M1054 116 L1102 153 L1161 153"/><path d="M1383 153 L1452 153 L1500 118"/><path d="M1068 301 L1135 279 L1172 279"/><path d="M1388 278 L1454 289 L1493 323"/></g>
    <g fill="#D8BAFF"><circle cx="1054" cy="116" r="6"/><circle cx="1500" cy="118" r="6"/><circle cx="1068" cy="301" r="6"/><circle cx="1493" cy="323" r="6"/></g>
  </g>
  <rect x="2" y="2" width="1596" height="416" rx="28" fill="none" stroke="#A855F7" stroke-opacity=".35" stroke-width="2"/>
