<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">CalvieroDev — Cybersecurity Community</title>
  <desc id="desc">Tarjeta destacada del proyecto CalvieroDev, una comunidad internacional de ciberseguridad.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0E0B1D"/><stop offset=".62" stop-color="#18112F"/><stop offset="1" stop-color="#0B0B19"/></linearGradient>
    <linearGradient id="stroke" x1="0" x2="1"><stop stop-color="#7C3AED"/><stop offset=".5" stop-color="#C084FC"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
    <radialGradient id="aura"><stop stop-color="#A855F7" stop-opacity=".32"/><stop offset="1" stop-color="#A855F7" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#E9D5FF" fill-opacity=".1"/></pattern>
    <clipPath id="clip"><rect x="2" y="2" width="1596" height="416" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1600" height="420" fill="url(#bg)"/><rect width="1600" height="420" fill="url(#dots)"/>
    <circle cx="1270" cy="206" r="350" fill="url(#aura)"/>
    <path d="M0 0 H1600" stroke="url(#stroke)" stroke-width="7"/>
    <path d="M0 419 H1600" stroke="url(#stroke)" stroke-opacity=".55" stroke-width="3"/>
    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <rect x="86" y="68" width="172" height="36" rx="18" fill="#6D28D9" fill-opacity=".22" stroke="#B18AF1" stroke-opacity=".5"/>
      <circle cx="107" cy="86" r="5" fill="#C4A0FF"/>
      <text x="121" y="92" fill="#DCC8FF" font-size="15" font-weight="700" letter-spacing="1.5">MAIN PROJECT</text>
      <text x="86" y="202" fill="#FFFFFF" font-size="84" font-weight="800" letter-spacing="-1">Calviero<tspan fill="#BF8CFF">Dev</tspan></text>
      <text x="89" y="246" fill="#D3C5EC" font-size="25" font-weight="500" letter-spacing=".8">Learn. Share. Connect. Secure.</text>
      <text x="89" y="297" fill="#AFA1C9" font-size="19">Comunidad internacional de ciberseguridad y tecnología.</text>
      <rect x="88" y="332" width="210" height="43" rx="11" fill="#A855F7" fill-opacity=".13" stroke="#A855F7" stroke-opacity=".6"/>
      <text x="193" y="359" text-anchor="middle" fill="#E6D5FF" font-size="17" font-weight="700" letter-spacing="1">EN DESARROLLO</text>
    </g>
    <!-- Large shield mark and digital orbit -->
    <circle cx="1271" cy="206" r="147" fill="none" stroke="#AD84FA" stroke-opacity=".21" stroke-width="2"/>
    <circle cx="1271" cy="206" r="119" fill="none" stroke="#AD84FA" stroke-opacity=".32" stroke-width="2" stroke-dasharray="5 12"/>
    <path d="M1271 83 L1376 122 L1376 204 Q1376 281 1271 344 Q1166 281 1166 204 L1166 122 Z" fill="#9B64F1" fill-opacity=".13" stroke="#D7BAFF" stroke-width="5" stroke-linejoin="round"/>
    <path d="M1271 115 L1349 146 L1349 207 Q1349 261 1271 309 Q1193 261 1193 207 L1193 146 Z" fill="#A855F7" fill-opacity=".13" stroke="#C8A4FA" stroke-opacity=".48" stroke-width="2"/>
